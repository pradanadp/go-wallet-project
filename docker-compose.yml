name: wallet-service

services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
      # Deterministic initialization: UTC + C locale so test results are the same
      # on every machine.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates a separate database for the integration tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: wallet-api
    depends_on:
      postgres:
        # The service does not start before PostgreSQL is really ready to accept
        # connections, so the startup migration cannot fail on timing.
        condition: service_healthy
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable"
      MIGRATE_ON_START: "true"
      DB_MAX_CONNS: "10"
      DB_MIN_CONNS: "2"
      DB_STATEMENT_TIMEOUT: "5s"
      REQUEST_TIMEOUT: "10s"
      SHUTDOWN_TIMEOUT: "15s"
      RATE_LIMIT_RPS: "50"
      RATE_LIMIT_BURST: "100"
      IDEMPOTENCY_TTL: "24h"
      LOG_LEVEL: "info"
      SYSTEM_WALLET_ID: "00000000-0000-0000-0000-000000000001"
      # Empty = API key authentication disabled (for the local demo only).
      API_KEY: ""
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
